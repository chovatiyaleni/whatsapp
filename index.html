<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<body class="bg-[#f7f5f2]">
    <!-- Main WhatsApp Container -->
    <div class="h-screen w-full flex overflow-hidden">
        <!-- Left Navigation Sidebar -->
        <div class="w-20 bg-white border-r border-gray-200 flex flex-col items-center justify-between py-3">
            <!-- Top Navigation -->
            <div class="flex flex-col items-center gap-6 w-full">
                <!-- Chats -->
                <button type="button" class="relative w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 text-xl">
                    <i class="fa-regular fa-message"></i>
                    
                </button>
                <!-- Calls -->
                <button type="button" class="w-12 h-12 rounded-full flex items-center justify-center text-gray-600 text-xl hover:bg-gray-100">
                    <i class="fa-solid fa-phone"></i>
                </button>
                <!-- Updates -->
                <button type="button" class="relative w-12 h-12 rounded-full flex items-center justify-center text-gray-600 text-xl hover:bg-gray-100">
                    <i class="fa-solid fa-circle-notch"></i>
                    <span class="absolute top-1 right-1 w-3 h-3 rounded-full bg-green-500"></span>
                </button>
                <!-- Communities -->
                <button type="button" class="relative w-12 h-12 rounded-full flex items-center justify-center text-gray-600 text-xl hover:bg-gray-100">
                    <i class="fa-solid fa-users"></i>
                    <span class="absolute top-1 right-1 w-3 h-3 rounded-full bg-green-500"></span>
                </button>
                <!-- Divider -->
                <div class="w-12 border-t border-gray-200"></div>
                <!-- Meta AI -->
                <button type="button" class="w-12 h-12 rounded-full flex items-center justify-center text-purple-500 text-2xl hover:bg-gray-100">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
            </div>
            <!-- Bottom Navigation -->
            <div class="flex flex-col items-center gap-6">
                <!-- Gallery -->
                <button type="button" class="w-12 h-12 rounded-full flex items-center justify-center text-gray-600 text-xl hover:bg-gray-100">
                    <i class="fa-regular fa-image"></i>
                </button>
                <!-- Profile -->
                <button type="button" class="w-12 h-12 rounded-full bg-orange-300 flex items-center justify-center text-white text-xl">
                    <i class="fa-solid fa-user"></i>
                </button>
            </div>
        </div>
        <!-- Chat List Section -->
        <div class="w-[30%] min-w-[430px] max-w-[520px] bg-white border-r border-gray-200 flex flex-col">
            <!-- Chat Header -->
            <div class="h-20 px-6 flex items-center justify-between">
                <h1 class="text-3xl font-bold text-[#16a34a]">WhatsApp</h1>
                <div class="flex items-center gap-7">
                    <button type="button" class="text-gray-700 text-xl">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <button type="button" class="w-12 h-12 rounded-full bg-green-600 text-white flex items-center justify-center text-xl">
                        <i class="fa-solid fa-message"></i>
                    </button>
                </div>
            </div>
            <!-- Search -->
            <div class="px-6 pb-3">
                <div class="h-12 rounded-full bg-gray-100 flex items-center px-5">
                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
                    <input type="text" placeholder="Search or start a new chat" class="w-full bg-transparent outline-none ml-4 text-base text-gray-700">
                </div>
            </div>
            <!-- Chat Filters -->
            <div class="px-6 pb-4 flex items-center gap-2 overflow-hidden">
                <button type="button" class="px-5 py-2 rounded-full bg-green-100 border border-green-300 text-green-700 text-sm font-medium">
                    All
                </button>
                <button type="button" class="px-5 py-2 rounded-full border border-gray-300 text-gray-600 text-sm whitespace-nowrap">
                    Unread 2
                </button>
                <button type="button" class="px-5 py-2 rounded-full border border-gray-300 text-gray-600 text-sm">
                    Favourites
                </button>
                <button type="button" class="px-5 py-2 rounded-full border border-gray-300 text-gray-600 text-sm">
                    Groups
                </button>
                <button type="button" class="w-10 h-10 rounded-full border border-gray-300 text-gray-600 flex items-center justify-center text-lg flex-shrink-0">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <!-- Chat List -->
            <div class="flex-1 overflow-y-auto">
                <!-- Chat 1 -->
                <div class="h-24 px-6 flex items-center hover:bg-gray-100 cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-pink-200 flex items-center justify-center text-pink-700 text-xl flex-shrink-0">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div class="ml-4 flex-1 min-w-0 border-b border-gray-100 h-full flex flex-col justify-center">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-medium text-gray-900">Grp 1</h3>
                            <span class="text-xs text-gray-500">1:19 pm</span>
                        </div>
                    </div>
                </div>
                <!-- Chat 2 -->
                <div class="h-24 px-6 flex items-center hover:bg-gray-100 cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-orange-300 flex items-center justify-center text-white text-xl flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="ml-4 flex-1 min-w-0 border-b border-gray-100 h-full flex flex-col justify-center">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-medium text-gray-900">Rahul</h3>
                            <span class="text-xs text-gray-500">3:27 pm</span>
                        </div>
                        <div class="flex items-center justify-between mt-1">
                            <p class="text-sm text-gray-600 truncate">
                                <span class="text-blue-500 mr-1">✓✓</span>
                                <i class="fa-regular fa-file mr-1"></i> send pdf
                            </p>
                            <i class="fa-solid fa-thumbtack text-gray-500 text-sm"></i>
                        </div>
                    </div>
                </div>
                <!-- Chat 3 -->
                <div class="h-24 px-6 flex items-center hover:bg-gray-100 cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xl flex-shrink-0">
                         <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="ml-4 flex-1 min-w-0 border-b border-gray-100 h-full flex flex-col justify-center">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-medium text-gray-900">Riya</h3>
                            <span class="text-xs text-gray-500">Thursday</span>
                        </div>
                        <div class="flex items-center justify-between mt-1">
                            <p class="text-sm text-gray-600 truncate"> hello</p>
                            <i class="fa-solid fa-thumbtack text-gray-500 text-sm"></i>
                        </div>
                    </div>
                </div>
                <!-- Chat 4 -->
                <div class="h-24 px-6 flex items-center hover:bg-gray-100 cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-green-200 flex items-center justify-center text-green-700 text-xl flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="ml-4 flex-1 min-w-0 border-b border-gray-100 h-full flex flex-col justify-center">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-medium text-gray-900">Jiya</h3>
                            <span class="text-xs text-gray-500">3:27 pm</span>
                        </div>
                    </div>
                </div>
              
               
                <!-- Chat 5 -->
                <div class="h-24 px-6 flex items-center hover:bg-gray-100 cursor-pointer">
                    <div class="w-14 h-14 rounded-full bg-yellow-300 flex items-center justify-center text-blue-600 text-xl flex-shrink-0">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                    <div class="ml-4 flex-1 min-w-0 h-full flex flex-col justify-center">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-medium text-gray-900">Flipkart</h3>
                            <span class="text-xs text-gray-500">12:30 pm</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1 truncate">Superfast Refund in just 2 mins: Dermato...</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Right Welcome Section -->
        <div class="flex-1 bg-[#f7f5f2] flex flex-col items-center justify-center">
            <!-- Welcome Card -->
            <div class="w-[500px] max-w-[90%] bg-white rounded-3xl p-10 text-center">
                <!-- Illustration -->
                <div class="w-64 h-44 mx-auto mb-7 flex items-center justify-center">
                    <div class="relative w-44 h-28 border-4 border-gray-800 rounded-xl bg-[#f5efe5]">
                        <div class="absolute -left-4 top-3 w-20 h-24 bg-green-400 border-4 border-gray-800 rounded-lg">
                            <div class="w-3 h-3 bg-gray-800 rounded-full absolute top-2 left-2"></div>
                            <div class="absolute top-9 left-3 right-3 border-t-2 border-gray-800"></div>
                            <div class="absolute top-14 left-3 right-3 border-t-2 border-gray-800"></div>
                            <div class="absolute top-19 left-3 right-3 border-t-2 border-gray-800"></div>
                        </div>
                        <div class="absolute right-8 top-7 text-green-500 text-5xl">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div class="absolute -bottom-5 left-[-15px] w-48 h-6 bg-green-100 border-4 border-gray-800 rounded-b-xl"></div>
                    </div>
                </div>
                <!-- Welcome Text -->
                <h2 class="text-3xl font-normal text-gray-900 leading-tight">
                    Voice and video calling is now available
                </h2>
                <p class="text-gray-500 text-base mt-4 leading-6">
                    Now you can make and join calls on WhatsApp Web.
                </p>
                <button type="button" class="mt-7 px-7 py-3 rounded-full bg-green-100 text-green-700 font-semibold hover:bg-green-200">
                    Go to Calls
                </button>
            </div>
            <!-- Bottom Actions -->
            <div class="flex items-start justify-center gap-10 mt-10">
                <!-- Send Document -->
                <div class="w-28 text-center">
                    <button type="button" class="w-16 h-16 rounded-full bg-white flex items-center justify-center mx-auto text-gray-700 text-2xl">
                        <i class="fa-regular fa-file-lines"></i>
                    </button>
                    <p class="text-sm text-gray-800 mt-3">Send document</p>
                </div>
                <!-- Add Contact -->
                <div class="w-28 text-center">
                    <button type="button" class="w-16 h-16 rounded-full bg-white flex items-center justify-center mx-auto text-gray-700 text-2xl">
                        <i class="fa-solid fa-user-plus"></i>
                    </button>
                    <p class="text-sm text-gray-800 mt-3">Add contact</p>
                </div>
                <!-- New Call -->
                <div class="w-28 text-center">
                    <button type="button" class="w-16 h-16 rounded-full bg-white flex items-center justify-center mx-auto text-gray-700 text-2xl">
                        <i class="fa-solid fa-video"></i>
                    </button>
                    <p class="text-sm text-gray-800 mt-3">New call</p>
                </div>
                <!-- Ask Meta AI -->
                <div class="w-28 text-center">
                    <button type="button" class="w-16 h-16 rounded-full bg-white flex items-center justify-center mx-auto text-purple-500 text-2xl">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                    <p class="text-sm text-gray-800 mt-3">Ask Meta AI</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
